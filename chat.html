<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المحادثات - لوحة التحكم</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css">
    <link rel="stylesheet" href="assets/css/main.css">
    <style>
        .chat-container { height: calc(100vh - 140px); background: white; border-radius: 12px; overflow: hidden; display: flex; }
        .chat-sidebar { width: 300px; border-left: 1px solid #eee; display: flex; flex-direction: column; }
        .chat-list { flex: 1; overflow-y: auto; }
        .chat-item { padding: 15px; border-bottom: 1px solid #f8f9fa; cursor: pointer; transition: all 0.2s; }
        .chat-item:hover, .chat-item.active { background: #f8f9fa; }
        .chat-main { flex: 1; display: flex; flex-direction: column; background: #f8f9fa; }
        .chat-header { padding: 15px; background: white; border-bottom: 1px solid #eee; }
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 70%; padding: 10px 15px; border-radius: 15px; position: relative; }
        .message.received { align-self: flex-start; background: white; border-bottom-right-radius: 2px; }
        .message.sent { align-self: flex-end; background: var(--primary); color: white; border-bottom-left-radius: 2px; }
        .chat-input { padding: 15px; background: white; border-top: 1px solid #eee; }
    </style>
</head>
<body>
    <div class="wrapper">
        <nav id="sidebar"></nav>

        <div id="content">
            <nav class="navbar navbar-expand-lg navbar-light" id="navbar"></nav>

            <div class="container-fluid">
                <div class="chat-container shadow-sm">
                    <!-- Chat Sidebar -->
                    <div class="chat-sidebar">
                        <div class="p-3 border-bottom">
                            <input type="text" class="form-control" placeholder="بحث في المحادثات...">
                        </div>
                        <div class="chat-list">
                            <!-- Data will be loaded from API -->
                        </div>
                    </div>

                    <!-- Chat Main -->
                    <div class="chat-main">
                        <div class="chat-header d-flex justify-content-between align-items-center">
                            <div class="d-flex align-items-center">
                                <div class="bg-primary-light rounded-circle p-2 me-2 text-primary">
                                    <i class="fas fa-user-md"></i>
                                </div>
                                <div>
                                    <h6 class="mb-0 fw-bold">د. أحمد محمد</h6>
                                    <small class="text-success">متصل الآن</small>
                                </div>
                            </div>
                            <button class="btn btn-light btn-sm text-danger">
                                <i class="fas fa-trash"></i> حذف المحادثة
                            </button>
                        </div>

                        <div class="chat-messages" id="messagesArea">
                            <!-- Messages will be loaded from API -->
                        </div>

                        <div class="chat-input">
                            <form id="messageForm" class="d-flex gap-2 align-items-center">
                                <input type="file" id="chatFileInput" class="d-none" onchange="previewFile()">
                                <button type="button" class="btn btn-light" onclick="document.getElementById('chatFileInput').click()">
                                    <i class="fas fa-paperclip"></i>
                                </button>
                                <div id="filePreview" class="d-none badge bg-secondary p-2 position-relative">
                                    <span id="fileNameDisplay"></span>
                                    <i class="fas fa-times ms-2 cursor-pointer" onclick="clearFile()"></i>
                                </div>
                                <input type="text" id="messageInput" class="form-control" placeholder="اكتب رسالتك هنا...">
                                <button type="submit" class="btn btn-primary"><i class="fas fa-paper-plane"></i></button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/layout.js"></script>
    <script>
        let currentChatId = null;

        document.addEventListener('DOMContentLoaded', () => {
            Layout.init('chat');
            loadConversations();
        });

        async function loadConversations() {
            try {
                const response = await ApiService.chat.getConversations();
                const conversations = response.data || response;
                const chatList = document.querySelector('.chat-list');
                
                if (conversations.length === 0) {
                    chatList.innerHTML = '<div class="text-center p-3 text-muted">لا توجد محادثات</div>';
                    return;
                }

                chatList.innerHTML = conversations.map(chat => `
                    <div class="chat-item ${currentChatId === chat.id ? 'active' : ''}" onclick="loadChat(${chat.id})">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <h6 class="mb-0 fw-bold">${chat.user?.name || chat.other_user_name || 'مستخدم'}</h6>
                            <small class="text-muted">${formatTime(chat.last_message_at)}</small>
                        </div>
                        <p class="text-muted small mb-0 text-truncate">${chat.last_message || 'لا توجد رسائل'}</p>
                    </div>
                `).join('');

                // Load first chat by default if exists
                if (!currentChatId && conversations.length > 0) {
                    loadChat(conversations[0].id);
                }
            } catch (error) {
                console.error('Failed to load conversations', error);
            }
        }

        async function loadChat(id) {
            currentChatId = id;
            
            // Update active state in list
            document.querySelectorAll('.chat-item').forEach(item => item.classList.remove('active'));
            // Note: In a real app we'd find the specific element to add 'active' class
            
            try {
                const response = await ApiService.chat.getMessages(id);
                const messages = response.data || response;
                const messagesArea = document.getElementById('messagesArea');
                
                // Update header info (mocked for now as we might need chat details endpoint)
                // document.querySelector('.chat-header h6').textContent = ...

                messagesArea.innerHTML = messages.map(msg => {
                    let content = msg.message;
                    if (msg.file_path) {
                        const fileUrl = `${API_BASE_URL.replace('/api', '')}/${msg.file_path}`;
                        if (msg.file_type && ['jpg', 'jpeg', 'png', 'gif', 'webp'].includes(msg.file_type.toLowerCase())) {
                            content += `<div class="mt-2"><img src="${fileUrl}" class="img-fluid rounded shadow-sm" style="max-height: 200px; cursor: pointer;" onclick="window.open('${fileUrl}')"></div>`;
                        } else {
                            content += `<div class="mt-2">
                                <a href="${fileUrl}" target="_blank" class="btn btn-sm btn-light border">
                                    <i class="fas fa-file-download me-1"></i> ${msg.file_name || 'ملف مرفق'}
                                </a>
                            </div>`;
                        }
                    }
                    return `
                        <div class="message ${msg.sender_type === 'doctor' ? 'sent' : 'received'}">
                            ${content}
                            <div class="small ${msg.sender_type === 'doctor' ? 'text-white-50' : 'text-muted'} mt-1">${formatTime(msg.created_at)}</div>
                        </div>
                    `;
                }).join('');
                
                messagesArea.scrollTop = messagesArea.scrollHeight;
            } catch (error) {
                console.error('Failed to load messages', error);
            }
        }

        function formatTime(dateString) {
            if (!dateString) return '';
            const date = new Date(dateString);
            return date.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
        }

        function previewFile() {
            const file = document.getElementById('chatFileInput').files[0];
            if (file) {
                document.getElementById('fileNameDisplay').textContent = file.name;
                document.getElementById('filePreview').classList.remove('d-none');
            }
        }

        function clearFile() {
            document.getElementById('chatFileInput').value = '';
            document.getElementById('filePreview').classList.add('d-none');
        }

        document.getElementById('messageForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentChatId) return;

            const input = document.getElementById('messageInput');
            const fileInput = document.getElementById('chatFileInput');
            const text = input.value;
            const hasFile = fileInput.files.length > 0;

            if (!text.trim() && !hasFile) return;

            const formData = new FormData();
            formData.append('receiver_id', currentChatId);
            if (text.trim()) formData.append('message', text);
            if (hasFile) formData.append('file', fileInput.files[0]);

            // Clear input immediately for UX
            input.value = '';
            clearFile();

            try {
                await ApiService.chat.sendMessage(formData);
                loadChat(currentChatId); // Reload to show server-side data (like file URL)
            } catch (error) {
                console.error('Failed to send message', error);
                alert('فشل إرسال الرسالة');
            }
        });
    </script>
</body>
</html>
