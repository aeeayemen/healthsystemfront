<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الملفات المساعدة - لوحة التحكم</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
    <div class="wrapper">
        <nav id="sidebar"></nav>

        <div id="content">
            <nav class="navbar navbar-expand-lg navbar-light" id="navbar"></nav>

            <div class="container-fluid">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2><i class="fas fa-file-medical me-2"></i>المحتوى المساعد (المراجع)</h2>
                    <button class="btn btn-primary" onclick="openAddModal()">
                        <i class="fas fa-plus me-2"></i>إضافة ملف جديد
                    </button>
                </div>

                <div class="card">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>الرقم</th>
                                        <th>اسم الملف</th>
                                        <th>النوع</th>
                                        <th>الوصف</th>
                                        <th>تاريخ الرفع</th>
                                        <th>إجراءات</th>
                                    </tr>
                                </thead>
                                <tbody id="tableBody">
                                    <!-- Data will be loaded from API -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Add/Edit Modal -->
    <div class="modal fade" id="formModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">إضافة ملف مساعد</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="dataForm">
                        <input type="hidden" id="editId">
                        <div class="mb-3">
                            <label class="form-label">اسم الملف (للعرض)</label>
                            <input type="text" class="form-control" id="formFileName" required placeholder="مثلاً: مرجع كراوس للتغذية">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">الملف</label>
                            <input type="file" class="form-control" id="formFile" required>
                            <small class="text-muted">انواع الملفات المسموحة: PDF, Images, Word</small>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">نوع الملف في التطبيق</label>
                            <select class="form-select" id="formFileType">
                                <option value="reference">مرجع طبي (Reference)</option>
                                <option value="public_ref">مرجع عام (Public Ref)</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">الوصف</label>
                            <textarea class="form-control" id="formDescription" rows="3"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">إلغاء</button>
                    <button type="button" class="btn btn-primary" onclick="saveData()">حفظ</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Delete Modal -->
    <div class="modal fade" id="deleteModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title">تأكيد الحذف</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body"><p>هل أنت متأكد من حذف هذا الملف؟ لا يمكن التراجع عن هذا الإجراء.</p></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">إلغاء</button>
                    <button type="button" class="btn btn-danger" id="confirmDeleteBtn">حذف</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/layout.js"></script>
    <script>
        let allData = [];
        let formModal, deleteModal;
        let deleteId = null;

        document.addEventListener('DOMContentLoaded', () => {
            Layout.init('helper-files');
            formModal = new bootstrap.Modal(document.getElementById('formModal'));
            deleteModal = new bootstrap.Modal(document.getElementById('deleteModal'));
            loadData();
            document.getElementById('confirmDeleteBtn').addEventListener('click', confirmDelete);
        });

        async function loadData() {
            const tableBody = document.getElementById('tableBody');
            tableBody.innerHTML = '<tr><td colspan="6" class="text-center py-4"><div class="spinner-border text-primary" role="status"></div><br>جاري التحميل...</td></tr>';
            
            try {
                // Fetch helper files (where patient_id is null)
                const response = await ApiService.medicalFiles.getAll();
                
                // Handle paginated response
                if (response && response.data) {
                    allData = response.data;
                } else if (Array.isArray(response)) {
                    allData = response;
                } else {
                    allData = [];
                }
                
                renderTable();
            } catch (error) {
                console.error('Failed to load helper files:', error);
                tableBody.innerHTML = '<tr><td colspan="6" class="text-center text-danger py-4">فشل تحميل البيانات: ' + error.message + '</td></tr>';
            }
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            if (!allData || allData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-4">لا توجد ملفات مساعدة مرفوعة حالياً</td></tr>';
                return;
            }

            tbody.innerHTML = allData.map(item => `
                <tr>
                    <td><span class="text-muted small">#${item.id}</span></td>
                    <td>
                        <div class="d-flex align-items-center">
                            <i class="fas ${getFileIcon(item.file_type)} me-2 text-primary fs-5"></i>
                            <div>
                                <div class="fw-bold">${item.file_name}</div>
                                <div class="small text-muted">${item.file_size ? (item.file_size / 1024 / 1024).toFixed(2) + ' MB' : ''}</div>
                            </div>
                        </div>
                    </td>
                    <td>
                        <span class="badge ${item.status === 'public_ref' ? 'bg-success' : 'bg-info'}">
                            ${item.status === 'public_ref' ? 'مرجع عام' : (item.status === 'reference' ? 'مرجع طبي' : (item.status || 'مرجع'))}
                        </span>
                    </td>
                    <td>
                        <div class="text-truncate" style="max-width: 250px;" title="${item.description || ''}">
                            ${item.description || '<span class="text-muted italic">لا يوجد وصف</span>'}
                        </div>
                    </td>
                    <td><div class="small">${formatDate(item.uploaded_at || item.created_at)}</div></td>
                    <td>
                        <div class="action-buttons">
                            <a href="${item.file_path ? ApiService.resolveImageUrl(item.file_path) : ApiService.medicalFiles.download(item.id)}" class="btn btn-sm btn-outline-primary" target="_blank" title="تحميل/عرض">
                                <i class="fas fa-download"></i>
                            </a>
                            <button class="btn btn-sm btn-outline-secondary" onclick="editItem(${item.id})" title="تعديل">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button class="btn btn-sm btn-outline-danger" onclick="openDeleteModal(${item.id})" title="حذف">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        function getFileIcon(type) {
            if (!type) return 'fa-file-alt';
            type = type.toLowerCase();
            if (['pdf'].includes(type)) return 'fa-file-pdf';
            if (['jpg', 'jpeg', 'png', 'gif', 'webp'].includes(type)) return 'fa-file-image';
            if (['doc', 'docx'].includes(type)) return 'fa-file-word';
            return 'fa-file-alt';
        }

        function formatDate(dateStr) {
            if (!dateStr) return '-';
            try {
                const date = new Date(dateStr);
                return date.toLocaleDateString('ar-SA', { year: 'numeric', month: 'short', day: 'numeric' });
            } catch (e) {
                return dateStr.split('T')[0];
            }
        }

        function openAddModal() {
            document.getElementById('modalTitle').textContent = 'رفع ملف مساعد جديد';
            document.getElementById('editId').value = '';
            document.getElementById('dataForm').reset();
            document.getElementById('formFile').required = true;
            formModal.show();
        }

        function editItem(id) {
            const item = allData.find(d => d.id === id);
            if (!item) return;

            document.getElementById('modalTitle').textContent = 'تعديل الملف المساعد';
            document.getElementById('editId').value = item.id;
            document.getElementById('formFileName').value = item.file_name;
            document.getElementById('formFileType').value = item.status || 'reference';
            document.getElementById('formDescription').value = item.description || '';
            document.getElementById('formFile').required = false;
            formModal.show();
        }

        async function saveData() {
            const id = document.getElementById('editId').value;
            const fileInput = document.getElementById('formFile');
            const fileName = document.getElementById('formFileName').value;
            const status = document.getElementById('formFileType').value;
            const description = document.getElementById('formDescription').value;

            if (!fileName) {
                alert('يرجى إدخال اسم للملف');
                return;
            }

            if (!id && fileInput.files.length === 0) {
                alert('يرجى اختيار ملف للرفع');
                return;
            }

            const formData = new FormData();
            formData.append('file_name', fileName);
            formData.append('status', status);
            formData.append('description', description);
            // Explicitly set patient_id to empty for helper files
            formData.append('patient_id', ''); 

            if (fileInput.files.length > 0) {
                formData.append('file', fileInput.files[0]);
            }

            const saveBtn = document.querySelector('#formModal .btn-primary');
            const originalText = saveBtn.innerHTML;
            saveBtn.disabled = true;
            saveBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>جاري الحفظ...';

            try {
                if (id) {
                    await ApiService.medicalFiles.update(id, formData);
                    if (typeof showToast === 'function') showToast('تم تحديث الملف بنجاح'); else alert('تم تحديث الملف بنجاح');
                } else {
                    await ApiService.medicalFiles.create(formData);
                    if (typeof showToast === 'function') showToast('تم رفع الملف بنجاح'); else alert('تم رفع الملف بنجاح');
                }
                formModal.hide();
                loadData();
            } catch (error) {
                console.error('Failed to save file:', error);
                alert('فشل حفظ الملف: ' + (error.message || 'خطأ في الاتصال بالخادم'));
            } finally {
                saveBtn.disabled = false;
                saveBtn.innerHTML = originalText;
            }
        }

        function openDeleteModal(id) {
            deleteId = id;
            deleteModal.show();
        }

        async function confirmDelete() {
            const btn = document.getElementById('confirmDeleteBtn');
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>جاري الحذف...';

            try {
                await ApiService.medicalFiles.delete(deleteId);
                if (typeof showToast === 'function') showToast('تم حذف الملف بنجاح'); else alert('تم حذف الملف بنجاح');
                deleteModal.hide();
                loadData();
            } catch (error) {
                console.error('Failed to delete file:', error);
                alert('فشل حذف الملف');
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        }
    </script>
</body>
</html>
