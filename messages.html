<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الرسائل - لوحة التحكم</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css">
    <link rel="stylesheet" href="assets/css/main.css">
    <style>
        /* Messages table compact styles */
        .messages-table thead th {
            font-size: 0.8rem;
            padding: 10px 8px !important;
            white-space: nowrap;
        }
        .messages-table tbody td {
            font-size: 0.85rem;
            padding: 10px 8px !important;
        }

        /* Messages table responsive card layout */
        @media (max-width: 1400px) {
            .messages-table thead {
                display: none;
            }
            .messages-table tbody tr {
                display: block;
                background: #fff;
                border: 1px solid #e9ecef;
                border-radius: 10px;
                margin-bottom: 12px;
                padding: 14px 16px;
                box-shadow: 0 1px 4px rgba(0,0,0,0.06);
            }
            .messages-table tbody td {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 8px 0 !important;
                border-bottom: 1px solid #f0f0f0 !important;
                text-align: left;
                gap: 10px;
            }
            .messages-table tbody td:last-child {
                border-bottom: none !important;
                justify-content: flex-end;
                padding-top: 10px !important;
            }
            .messages-table tbody td::before {
                content: attr(data-label);
                font-weight: 600;
                color: var(--primary, #4361ee);
                min-width: 90px;
                flex-shrink: 0;
                font-size: 0.85rem;
            }
            .messages-table tbody td:last-child::before {
                display: none;
            }
            .messages-table tbody td .text-truncate {
                max-width: 100% !important;
                white-space: normal !important;
                word-break: break-word;
            }
            .messages-table tbody td .btn-group {
                width: 100%;
                justify-content: flex-end;
            }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <nav id="sidebar"></nav>
        <div id="content">
            <nav class="navbar navbar-expand-lg navbar-light" id="navbar"></nav>
            <div class="container-fluid">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2><i class="fas fa-envelope me-2"></i>الرسائل</h2>
                </div>

                <div class="card"><div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover messages-table">
                            <thead class="table-light">
                                <tr>
                                    <th>الرقم</th>
                                    <th>المستخدم</th>
                                    <th>الطبيب</th>
                                    <th style="min-width: 200px;">الرسالة / الملف</th>
                                    <th>الوقت</th>
                                    <th>التاريخ</th>
                                    <th>الحالة</th>
                                    <th>إجراءات</th>
                                </tr>
                            </thead>
                            <tbody id="tableBody" class="align-middle">
                                <!-- سيتم ملؤه بواسطة JS -->
                            </tbody>
                        </table>
                    </div>
                    <div class="pagination-container"><div class="text-muted" id="paginationInfo"></div><nav><ul class="pagination mb-0" id="pagination"></ul></nav></div>
                </div></div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="deleteModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content">
        <div class="modal-header bg-danger text-white"><h5 class="modal-title">تأكيد الحذف</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
        <div class="modal-body"><p>هل أنت متأكد من حذف هذه الرسالة؟</p></div>
        <div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">إلغاء</button><button type="button" class="btn btn-danger" id="confirmDeleteBtn">حذف</button></div>
    </div></div></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/layout.js"></script>
    <script>
        let allData=[],currentPage=1,perPage=10,formModal,deleteModal,deleteId=null;
        document.addEventListener('DOMContentLoaded',()=>{Layout.init('messages');deleteModal=new bootstrap.Modal(document.getElementById('deleteModal'));loadData();loadUsers();loadDoctors();document.getElementById('confirmDeleteBtn').addEventListener('click',confirmDelete);});
        
        async function loadData(){
            try {
                const response = await ApiService.chat.adminChats();
                const conversations = response.data || response || [];
                allData = conversations.map(c => ({
                    id: c.id,
                    user_id: c.user_id || c.patient_id || '-',
                    doctor_id: c.doctor_id || '-',
                    message: c.massage || c.last_message || c.message || c.content || c.body || c.text || '',
                    file_path: c.file_path,
                    file_type: c.file_type,
                    time: c.time || (c.updated_at ? c.updated_at.split('T')[1]?.substring(0,5) : '-'),
                    date: c.date || (c.updated_at ? c.updated_at.split('T')[0] : '-'),
                    read: c.read !== undefined ? c.read : true
                }));
                // Sort newest first by ID descending
                allData.sort((a, b) => b.id - a.id);
                renderTable();
            } catch (error) {
                console.error('Failed to load messages:', error);
                document.getElementById('tableBody').innerHTML = '<tr><td colspan="8" class="text-center text-danger py-4">فشل تحميل البيانات</td></tr>';
            }
        }
        
        async function loadUsers() {
            try {
                const response = await ApiService.users.getAll(); 
                const users = response.data || response;
                const select = document.getElementById('formUserId');
                if(select) select.innerHTML = '<option value="">اختر المستخدم...</option>' + 
                    users.map(u => `<option value="${u.id}">${u.name} (${u.email})</option>`).join('');
            } catch (error) {
                console.error('Failed to load users', error);
            }
        }

        async function loadDoctors() {
            try {
                const response = await ApiService.doctors.getAll({application_status: 'approved'}); 
                const doctors = response.data || response;
                const select = document.getElementById('formDoctorId');
                if(select) select.innerHTML = '<option value="">اختر الطبيب...</option>' + 
                    doctors.map(d => `<option value="${d.id}">${d.name}</option>`).join('');
            } catch (error) {
                console.error('Failed to load doctors', error);
            }
        }
        
        function renderTable() {
            const tbody = document.getElementById('tableBody');
            const start = (currentPage - 1) * perPage;
            const pageData = allData.slice(start, start + perPage);
            
            tbody.innerHTML = pageData.length === 0 ? '<tr><td colspan="8" class="text-center text-muted py-4">لا توجد رسائل</td></tr>' : pageData.map(item => {
                let messageHtml = `<div class="text-truncate" style="max-width:250px;">${item.message || ''}</div>`;
                
                if (item.file_path) {
                    const cleanPath = item.file_path.startsWith('/') ? item.file_path.substring(1) : item.file_path;
                    const fileUrl = `${API_BASE_URL.replace('/api', '')}/${cleanPath}`;
                    
                    if (item.file_type && ['jpg', 'jpeg', 'png', 'gif', 'webp'].includes(item.file_type.toLowerCase())) {
                        messageHtml += `
                            <div class="mt-2">
                                <img src="${fileUrl}" 
                                     style="height: 50px; width: 50px; object-fit: cover; cursor: pointer;" 
                                     onclick="window.open('${fileUrl}')" 
                                     class="rounded border shadow-sm"
                                     onerror="this.src='https://placehold.co/50x50?text=Image';this.onerror=null;">
                            </div>`;
                    } else {
                        messageHtml += `
                            <div class="mt-2">
                                <a href="${fileUrl}" target="_blank" class="btn btn-sm btn-outline-primary py-0 px-2">
                                    <i class="fas fa-paperclip small"></i> ملف
                                </a>
                            </div>`;
                    }
                }
                
                return `<tr class="${!item.read ? 'table-warning' : ''}">
                    <td data-label="الرقم">${item.id}</td>
                    <td data-label="المستخدم"><span class="badge bg-light text-dark border">${item.user_id}</span></td>
                    <td data-label="الطبيب"><span class="badge bg-light text-dark border">${item.doctor_id}</span></td>
                    <td data-label="الرسالة">${messageHtml || '-'}</td>
                    <td data-label="الوقت"><small>${item.time}</small></td>
                    <td data-label="التاريخ"><small>${item.date}</small></td>
                    <td data-label="الحالة"><span class="badge ${item.read ? 'bg-success' : 'bg-warning'}">${item.read ? 'مقروءة' : 'جديدة'}</span></td>
                    <td>
                        <div class="btn-group">
                            <button class="btn btn-sm btn-outline-danger" onclick="openDeleteModal(${item.id})" title="حذف"><i class="fas fa-trash"></i></button>
                        </div>
                    </td>
                </tr>`;
            }).join('');
            renderPagination();
        }
        
        function renderPagination(){const tp=Math.ceil(allData.length/perPage);document.getElementById('paginationInfo').textContent=`عرض ${allData.length>0?(currentPage-1)*perPage+1:0} - ${Math.min(currentPage*perPage,allData.length)} من ${allData.length}`;let h=`<li class="page-item ${currentPage===1?'disabled':''}"><a class="page-link" href="#" onclick="goToPage(${currentPage-1})">السابق</a></li>`;for(let i=1;i<=tp;i++)h+=`<li class="page-item ${currentPage===i?'active':''}"><a class="page-link" href="#" onclick="goToPage(${i})">${i}</a></li>`;h+=`<li class="page-item ${currentPage===tp||tp===0?'disabled':''}"><a class="page-link" href="#" onclick="goToPage(${currentPage+1})">التالي</a></li>`;document.getElementById('pagination').innerHTML=h;}
        
        function goToPage(p){const tp=Math.ceil(allData.length/perPage);if(p>=1&&p<=tp){currentPage=p;renderTable();}}

        
        function openDeleteModal(id){deleteId=id;deleteModal.show();}
        
        async function confirmDelete(){
            if(!deleteId)return;
            try {
                await ApiService.chat.deleteMessage(deleteId);
                deleteId=null;
                deleteModal.hide();
                loadData();
            } catch (error) {
                console.error('Failed to delete message:', error);
                alert('فشل حذف الرسالة');
            }
        }
    </script>
</body>
</html>
