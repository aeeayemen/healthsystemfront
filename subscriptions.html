<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المستخدمين المشتركين - لوحة التحكم</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
   <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css">
    <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
    <div class="wrapper">
        <nav id="sidebar"></nav>

        <div id="content">
            <nav class="navbar navbar-expand-lg navbar-light" id="navbar"></nav>

            <div class="container-fluid">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="fw-bold text-primary">المستخدمين المشتركين</h2>
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#subModal" onclick="resetForm()">
                        <i class="fas fa-plus me-2"></i> إضافة طلب اشتراك
                    </button>
                </div>

                <div class="card">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover" id="subsTable">
                                <thead>
                                    <tr>
                                        <th>#</th>
                                        <th>المستخدم</th>
                                        <th>الطبيب</th>
                                        <th>نوع الاشتراك</th>
                                        <th>السعر</th>
                                        <th>الفترة</th>
                                        <th>السند</th>
                                        <th>الحالة</th>
                                        <th>الإجراءات</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <!-- Injected by JS -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Receipt + Approve Payment Modal -->
    <div class="modal fade" id="receiptModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title"><i class="fas fa-file-image me-2"></i>صورة سند الدفع</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body text-center p-3">
                    <div class="mb-3">
                        <span class="badge bg-secondary" id="receiptPatientName"></span>
                    </div>
                    <img id="receiptImage" src="" class="img-fluid rounded shadow" alt="سند الدفع" style="max-height:420px;object-fit:contain;">
                    <div id="receiptNoImage" class="py-5 text-muted d-none">
                        <i class="fas fa-image fa-3x mb-2"></i>
                        <p>لا توجد صورة سند مرفقة</p>
                    </div>
                </div>
                <div class="modal-footer justify-content-between">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">إغلاق</button>
                    <button type="button" class="btn btn-success" id="approvePaymentBtn" onclick="approvePaymentFromModal()">
                        <i class="fas fa-check-circle me-2"></i>اعتماد الدفع وتفعيل الاشتراك
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Subscription Modal -->
    <div class="modal fade" id="subModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">إضافة اشتراك جديد</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="subForm">
                        <input type="hidden" id="subId">
                        <div class="mb-3">
                            <label class="form-label">المستخدم</label>
                            <select class="form-select" id="subPatient" required></select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">الطبيب</label>
                            <select class="form-select" id="subDoctor" required></select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">نوع الاشتراك</label>
                            <select class="form-select" id="subType" required>
                                <option value="monthly">شهري</option>
                                <option value="quarterly">ربع سنوي</option>
                                <option value="yearly">سنوي</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">السعر</label>
                            <input type="number" class="form-control" id="subPrice" required>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">تاريخ البداية</label>
                                <input type="date" class="form-control" id="subStart" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">تاريخ النهاية</label>
                                <input type="date" class="form-control" id="subEnd" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">حالة الدفع</label>
                            <select class="form-select" id="subStatus">
                                <option value="active">نشط (مدفوع)</option>
                                <option value="pending">معلق</option>
                                <option value="expired">منتهي</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">صورة سند الاشتراك</label>
                            <input type="file" class="form-control" id="subReceipt" accept="image/*">
                            <div id="receiptPreview" class="mt-2 d-none">
                                <img id="receiptPreviewImg" src="" class="img-thumbnail" style="max-height: 100px;">
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">حفظ وحفظ التعديلات</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/layout.js"></script>
    <script>
        let subModal;
        
        let currentReceiptSubId = null;

        document.addEventListener('DOMContentLoaded', () => {
            Layout.init('subscriptions');
            subModal = new bootstrap.Modal(document.getElementById('subModal'));
            receiptModal = new bootstrap.Modal(document.getElementById('receiptModal'));
            loadPatients();
            loadDoctors();
            renderSubs();
        });

        async function loadDoctors() {
            try {
                const response = await ApiService.doctors.getAll({ application_status: 'approved' });
                const doctors = response.data || response;
                document.getElementById('subDoctor').innerHTML = '<option value="">اختر الطبيب...</option>' + 
                    doctors.map(d => `<option value="${d.id}">${d.name}</option>`).join('');
            } catch (error) {
                console.error('Failed to load doctors', error);
            }
        }

        async function loadPatients() {
            try {
                const response = await ApiService.patients.getAll();
                const patients = response.data || response;
                document.getElementById('subPatient').innerHTML = '<option value="">اختر المستخدم...</option>' + 
                    patients.map(p => `<option value="${p.id}">${p.fullname || p.name}</option>`).join('');
            } catch (error) {
                console.error('Failed to load patients', error);
            }
        }

        // Show receipt image and set the current subscription id for approval
        function viewReceipt(subId, path, patientName, isPending) {
            currentReceiptSubId = subId;
            const img = document.getElementById('receiptImage');
            const noImg = document.getElementById('receiptNoImage');
            const approveBtn = document.getElementById('approvePaymentBtn');
            document.getElementById('receiptPatientName').textContent = patientName || '';

            if (path) {
                img.src = ApiService.resolveImageUrl(path);
                img.classList.remove('d-none');
                noImg.classList.add('d-none');
            } else {
                img.src = '';
                img.classList.add('d-none');
                noImg.classList.remove('d-none');
            }

            // Only show approve button if subscription is still pending
            if (isPending) {
                approveBtn.classList.remove('d-none');
            } else {
                approveBtn.classList.add('d-none');
            }

            receiptModal.show();
        }

        // Approve from within the receipt modal
        async function approvePaymentFromModal() {
            if (!currentReceiptSubId) return;
            await approvePayment(currentReceiptSubId);
            receiptModal.hide();
        }

        // Approve subscription status → backend automatically sets user.type to 'payed'
        async function approvePayment(subId) {
            if (!confirm('هل أنت متأكد من اعتماد الدفع وتفعيل الاشتراك؟')) return;
            try {
                // Single call: backend SubscriptionController::update() automatically
                // sets patient.user.type = 'payed' when status is set to 'active'
                await ApiService.patients.update(subId, { status: 'active' });

                showToast('تم اعتماد الدفع وتفعيل الاشتراك بنجاح ✓', 'success');
                renderSubs();
            } catch (error) {
                console.error('Failed to approve payment', error);
                showToast('فشل اعتماد الدفع: ' + (error.message || 'خطأ غير معروف'), 'error');
            }
        }

        async function approveSub(id) {
            await approvePayment(id);
        }

        async function renderSubs() {
            try {
                const response = await ApiService.patients.getAll();
                let subs = response.data || response;
                
                if (!Array.isArray(subs)) subs = [];

                const tbody = document.querySelector('#subsTable tbody');
                
                if (subs.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="9" class="text-center">لا توجد اشتراكات لعرضها</td></tr>';
                    return;
                }

                tbody.innerHTML = subs.map(sub => {
                    const patientName = sub.patient_name || (sub.patient ? (sub.patient.fullname || sub.patient.name) : 'غير محدد');
                    const isPending = sub.subscription_status === 'pending' || sub.status === 'pending';
                    const status = sub.subscription_status || sub.status;
                    const statusColor = getStatusColor(status);
                    
                    const receiptImg = sub.subscription_receipt_image || sub.receipt_image || '';
                    const hasReceipt = !!receiptImg;

                    return `
                <tr class="${isPending ? 'table-warning' : ''}">
                    <td>${sub.id}</td>
                    <td>${patientName}</td>
                    <td>${sub.doctor_name || (sub.doctor ? sub.doctor.name : '-')}</td>
                    <td>${getTypeName(sub.subscription_type || sub.plan_type || sub.type)}</td>
                    <td>${sub.subscription_price || sub.price || 0} ريال</td>
                    <td>${sub.subscription_start_date || sub.start_date || '-'} ← ${sub.subscription_end_date || sub.end_date || '-'}</td>
                    <td>
                        <button class="btn btn-sm ${hasReceipt ? 'btn-outline-info' : 'btn-outline-secondary'}" 
                            onclick="viewReceipt(${sub.id}, '${receiptImg}', '${patientName.replace(/'/g, "\\'") }', ${isPending})" 
                            title="${hasReceipt ? 'عرض سند الدفع' : 'لا يوجد سند'}">
                            <i class="fas fa-${hasReceipt ? 'image' : 'image-slash'} me-1"></i>${hasReceipt ? 'عرض السند' : 'بلا سند'}
                        </button>
                    </td>
                    <td>
                        <span class="badge bg-${statusColor}">${getStatusName(status)}</span>
                    </td>
                    <td>
                        <div class="d-flex gap-1 flex-wrap">
                            ${isPending ? `
                                <button class="btn btn-sm btn-success" onclick="approvePayment(${sub.id})" title="اعتماد الدفع">
                                    <i class="fas fa-check"></i>
                                </button>
                            ` : ''}
                            <button class="btn btn-sm btn-outline-primary" onclick="editSub(${sub.id})" title="تعديل">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button class="btn btn-sm btn-outline-danger" onclick="deleteSub(${sub.id})" title="حذف">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </td>
                </tr>`;
                }).join('');
            } catch (error) {
                console.error('Failed to load subscriptions', error);
                document.querySelector('#subsTable tbody').innerHTML = '<tr><td colspan="9" class="text-center text-danger">فشل تحميل بيانات المشتركين</td></tr>';
            }
        }

        function getTypeName(type) {
            return { monthly: 'شهري', quarterly: 'ربع سنوي', yearly: 'سنوي' }[type] || type;
        }

        function getStatusColor(status) {
            return { active: 'success', pending: 'warning', expired: 'danger' }[status] || 'secondary';
        }

        function showToast(message, type = 'success') {
            if (typeof window.showToast === 'function' && window.showToast !== showToast) {
                window.showToast(message, type);
                return;
            }
            const toast = document.createElement('div');
            toast.className = `alert alert-${type === 'error' ? 'danger' : 'success'} position-fixed`;
            toast.style.cssText = 'bottom:20px;left:50%;transform:translateX(-50%);z-index:9999;min-width:280px;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.15);';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3500);
        }

        function getStatusName(status) {
            return { active: 'نشط', pending: 'معلق', expired: 'منتهي' }[status] || status;
        }

        function resetForm() {
            document.getElementById('subForm').reset();
            document.getElementById('subId').value = '';
            document.getElementById('subDoctor').value = '';
            document.getElementById('receiptPreview').classList.add('d-none');
            document.getElementById('modalTitle').innerText = 'إضافة اشتراك جديد';
        }

        async function editSub(id) {
            try {
                const response = await ApiService.patients.get(id);
                const sub = response.data || response;

                document.getElementById('subId').value = sub.id;
                document.getElementById('subPatient').value = sub.id; 
                document.getElementById('subDoctor').value = sub.current_doctor_id || '';
                document.getElementById('subType').value = sub.subscription_type || '';
                document.getElementById('subPrice').value = sub.subscription_price || '';
                document.getElementById('subStart').value = sub.subscription_start_date || '';
                document.getElementById('subEnd').value = sub.subscription_end_date || '';
                document.getElementById('subStatus').value = sub.subscription_status || 'pending';
                document.getElementById('modalTitle').innerText = 'تعديل بيانات المستخدم المشترك';
                
                const previewImg = document.getElementById('receiptPreviewImg');
                const previewDiv = document.getElementById('receiptPreview');
                const receiptImg = sub.subscription_receipt_image || sub.receipt_image;
                if (receiptImg) {
                    previewImg.src = ApiService.resolveImageUrl(receiptImg);
                    previewDiv.classList.remove('d-none');
                } else {
                    previewDiv.classList.add('d-none');
                }

                subModal.show();
            } catch (error) {
                console.error('Failed to load details', error);
                showToast('فشل تحميل التفاصيل', 'error');
            }
        }

        async function deleteSub(id) {
            if (confirm('هل أنت متأكد من حذف هذا المستخدم من قائمة المشتركين؟')) {
                try {
                    await ApiService.patients.delete(id);
                    renderSubs();
                    showToast('تم الحذف بنجاح');
                } catch (error) {
                    console.error('Failed to delete', error);
                    showToast('فشل الحذف', 'error');
                }
            }
        }

        document.getElementById('subForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('subId').value;
            const patientId = document.getElementById('subPatient').value;
            
            const formData = new FormData();
            formData.append('doctor_id', document.getElementById('subDoctor').value);
            formData.append('type', document.getElementById('subType').value);
            formData.append('price', document.getElementById('subPrice').value);
            formData.append('start_date', document.getElementById('subStart').value);
            formData.append('end_date', document.getElementById('subEnd').value);
            formData.append('status', document.getElementById('subStatus').value);
            
            const receiptFile = document.getElementById('subReceipt').files[0];
            if (receiptFile) {
                formData.append('receipt_image', receiptFile);
            }

            try {
                const targetId = id || patientId;
                if (!targetId) {
                    showToast('يرجى اختيار مريض أولاً', 'error');
                    return;
                }

                await ApiService.patients.updateWithFile(targetId, formData);
                showToast('تم تحديث بيانات الاشتراك بنجاح ✓');
                
                subModal.hide();
                renderSubs();
            } catch (error) {
                console.error('Failed to save', error);
                showToast('فشل الحفظ: ' + (error.message || 'خطأ غير معروف'), 'error');
            }
        });
    </script>
</body>
</html>
